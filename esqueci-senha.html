<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Controle de Estoque</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@1.53.0/dist/umd/lucide.min.js"></script>
</head>
<body class="h-full flex items-center justify-center bg-slate-900 text-slate-100 p-6">

    <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl border border-slate-800 shadow-2xl space-y-6">
        
        <!-- Cabeçalho -->
        <div class="text-center space-y-2">
            <div class="inline-flex p-3 bg-blue-600 rounded-xl shadow-lg shadow-blue-600/30 mb-1">
                <i data-lucide="key-round" class="w-6 h-6 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Recuperar Senha</h1>
            <p class="text-sm text-slate-400">Informe seu e-mail cadastrado para receber as instruções de redefinição.</p>
        </div>

        <!-- Formulário de Recuperação -->
        <form id="form-recuperar" class="space-y-4">
            
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                    E-mail Corporativo
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </span>
                    <input 
                        type="email" 
                        required 
                        placeholder="seu.email@empresa.com"
                        class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                    >
                </div>
            </div>

            <button 
                type="submit" 
                class="w-full mt-2 flex items-center justify-center gap-2 py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/25 transition-all duration-200 cursor-pointer"
            >
                <i data-lucide="send" class="w-4 h-4"></i>
                <span>Enviar Instruções</span>
            </button>
        </form>

        <!-- Voltar para o Login -->
        <div class="text-center pt-2 border-t border-slate-800">
            <a href="login.html" class="inline-flex items-center gap-2 text-xs text-blue-400 hover:text-blue-300 transition-colors font-medium">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                <span>Voltar para a tela de login</span>
            </a>
        </div>

    </div>

    <script src="js/esqueci-senha.js"></script>
</body>
</html>
