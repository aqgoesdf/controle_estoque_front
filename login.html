<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema de Controle de Estoque</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="h-full flex items-center justify-center bg-slate-900 text-slate-100 p-6">

    <div class="w-full max-w-md bg-slate-850 p-8 rounded-2xl border border-slate-800 shadow-2xl space-y-6">
        
        <!-- Cabeçalho -->
        <div class="text-center space-y-2">
            <div class="inline-flex p-3 bg-blue-600 rounded-xl shadow-lg shadow-blue-600/30 mb-1">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Stock-AqGoEs Pro</h1>
            <p class="text-sm text-slate-400">Entre com suas credenciais para acessar o estoque</p>
        </div>

        <!-- Alvo para mensagens de erro retornadas pelo servidor via HTMX -->
        <div id="erro-login"></div>

        <!-- Formulário com HTMX -->
        <form hx-post="/api/login" 
              hx-target="#erro-login" 
              hx-swap="innerHTML"
              hx-indicator="#loading-spinner"
              class="space-y-4">
            
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                    E-mail Corporativo
                </label>
                <input 
                    type="email" 
                    name="email" 
                    required 
                    placeholder="seu.email@empresa.com"
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                >
            </div>

            <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                        Senha
                    </label>
                    <a href="#" class="text-xs text-blue-400 hover:text-blue-300 transition-colors">
                        Esqueceu?
                    </a>
                </div>
                <input 
                    type="password" 
                    name="password" 
                    required 
                    placeholder="••••••••"
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                >
            </div>

            <button 
                type="submit" 
                class="w-full mt-2 flex items-center justify-center gap-2 py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/25 transition-all duration-200 cursor-pointer"
            >
                <span>Entrar no Sistema</span>
                <!-- Indicador de carregamento acionado pelo HTMX -->
                <svg id="loading-spinner" class="htmx-indicator w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin ml-2" style="display:none;" viewBox="0 0 24 24"></svg>
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800">
            <p class="text-xs text-slate-500">
                Acesso restrito a colaboradores autorizados.
            </p>
        </div>

    </div>

    <!-- Script rápido para gerenciar o estado visual do htmx-indicator -->
    <script>
        document.addEventListener('htmx:configRequest', (evt) => {
            document.getElementById('loading-spinner').style.display = 'inline-block';
        });
        document.addEventListener('htmx:afterOnLoad', (evt) => {
            document.getElementById('loading-spinner').style.display = 'none';
        });
    </script>
</body>
</html>
